<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title> </title>
    
  </head>

  <body>
    <div class="topbar">
      <p style="margin-left: 0; background-color: rgba(187, 187, 187, 0.5); padding: 5px; border-radius: 22px; padding-left: 10px; padding-right: 10px; cursor: pointer;" id="welcomeopen">

            PolarOS

      </p>

       <p style="text-align: center; position: absolute;left: 50%; transform: translateX(-50%); white-space: nowrap; background-color: rgba(187, 187, 187, 0.5); padding: 5px 10px; border-radius: 22px; padding-left: 10px; padding-right: 10px;">

            Be creative💡

      </p>

      
      <p id="timeElement" style="margin-left: 40%; background-color: rgba(187, 187, 187, 0.5); padding: 5px; border-radius: 22px; padding-left: 10px; padding-right: 10px;">

            Time

      </p>
      
    </div>
    <div id="welcome" class="welcome">
      <div id="welcomeheader">
        <p style="cursor:pointer" id="welcomeclose">X</p>
      </div>
      <h1>Hi welcome to PolarOS</h1>
      <h2 style="text-align: left; font-family: 'URW Chancery L', cursive; font-weight: 50">PolarOS is a feature-limited OS to answer the unanswerable questions of "who is Polar?"</h2>
      
    </div>
    <script>


      function updateTime() {
              var currentTime = new Date().toLocaleString();

              var timeText = document.querySelector("#timeElement")

              timeText.innerHTML = currentTime 
      
      }
      
      updateTime();
      setInterval(updateTime, 1000);

      
    </script>
    <script src="javascript/script.js"></script>

  </body>
</html>
